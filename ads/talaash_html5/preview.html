<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Talaash ad preview</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#1b1d22;font-family:system-ui,sans-serif;color:#ddd}
  iframe{width:320px;height:480px;border:0;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.6);background:#000}
  button{padding:8px 18px;border:0;border-radius:18px;background:#f05a00;color:#fff;font-size:14px;cursor:pointer}
  small{color:#8a8f98}
</style>
</head>
<body>
  <iframe id="f" src="index.html" title="ad"></iframe>
  <button onclick="document.getElementById('f').src='index.html?'+Date.now()">&#8635; Replay</button>
  <small>320&times;480 &middot; tap the ad to advance &middot; ~25s auto-play</small>
</body>
</html>
